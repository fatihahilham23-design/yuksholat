name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Yuk Sholat ${{ github.ref_name }}
          body: |
            🕌 **Yuk Sholat** — Pixel Art Prayer Tracker

            Install [Yuk Sholat.apk](https://github.com/fatihahilham23-design/yuksholat/releases/latest/download/app-debug.apk) langsung di perangkat Android.

            ### Fitur
            - Tracker 5 waktu shalat + poin gamifikasi
            - Daily streak 🔥, daily goal, 12 achievement badge
            - Tier RPG 5 level + animasi transformasi
            - Ramadan mode + alarm imsak/sahur
            - Home screen widget + alarm shalat
            - 100% offline (perhitungan astronomi)
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/app-debug.apk